<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gigly — Creator Marketplace</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f232e;
    --border: #2a2f3d;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --accent: #7c5cff;
    --accent-2: #a78bfa;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ---------- Layout ---------- */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  nav.tabs button {
    background: transparent; color: var(--muted); border: 1px solid transparent;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
    font-weight: 500; transition: all 0.15s;
  }
  nav.tabs button:hover { color: var(--text); background: var(--panel-2); }
  nav.tabs button.active { color: var(--text); background: var(--panel-2); border-color: var(--border); }

  .user-switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .user-switch select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }

  main { flex: 1; padding: 28px; max-width: 1200px; width: 100%; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.page-title { font-size: 26px; margin-bottom: 4px; }
  p.page-sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }

  /* ---------- Cards / Panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; gap: 14px; max-width: 620px; }
  .form-grid label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 13px; border-radius: 8px; font-size: 14px;
    font-family: inherit; outline: none; transition: border 0.15s;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: var(--accent); }
  .form-grid textarea { resize: vertical; min-height: 90px; }

  .btn {
    border: none; padding: 11px 18px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }
  .btn-success { background: var(--green); color: #04220f; }
  .btn-success:hover { filter: brightness(1.1); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }

  /* ---------- Marketplace ---------- */
  .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .filters input { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 14px; outline: none; }
  .filters input:focus { border-color: var(--accent); }
  .filters select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; outline: none; }
  .filters select:focus { border-color: var(--accent); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  .gig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .gig-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
    transition: all 0.15s; position: relative;
  }
  .gig-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .gig-card .cat-badge {
    display: inline-block; background: rgba(124,92,255,0.15); color: var(--accent-2);
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.5px; width: fit-content;
  }
  .gig-card h3 { font-size: 16px; line-height: 1.35; }
  .gig-card .desc { color: var(--muted); font-size: 13px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gig-card .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .gig-card .rate { font-weight: 700; color: var(--green); font-size: 16px; }
  .gig-card .creator { font-size: 12px; color: var(--muted); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .big { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }

  /* ---------- Booking list ---------- */
  .booking-list { display: flex; flex-direction: column; gap: 12px; }
  .booking-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; display: flex; gap: 16px; align-items: flex-start;
    justify-content: space-between; flex-wrap: wrap;
  }
  .booking-card .info { flex: 1; min-width: 220px; }
  .booking-card .info h4 { font-size: 15px; margin-bottom: 4px; }
  .booking-card .info .meta { font-size: 13px; color: var(--muted); }
  .booking-card .info .msg { font-size: 13px; color: var(--muted); margin-top: 6px; font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; }
  .booking-card .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .status {
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
  }
  .status.pending { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .status.accepted { background: rgba(34,197,94,0.15); color: var(--green); }
  .status.declined { background: rgba(239,68,68,0.15); color: var(--red); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    transform: scale(0.96); transition: transform 0.2s;
  }
  .modal-backdrop.open .modal { transform: scale(1); }
  .modal h3 { margin-bottom: 6px; font-size: 19px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .modal .form-grid { max-width: 100%; }

  /* ---------- Confirmation toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--panel); border: 1px solid var(--green); color: var(--text);
    padding: 14px 22px; border-radius: 10px; font-size: 14px; font-weight: 500;
    z-index: 300; transition: transform 0.3s ease; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .check { color: var(--green); font-weight: 700; }

  /* ---------- Stats row ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  @media (max-width: 640px) {
    main { padding: 16px; }
    header.topbar { padding: 12px 16px; }
    .brand { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><div class="dot"></div><span>Gigly</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="marketplace" class="active">Marketplace</button>
      <button data-view="post">Post a Gig</button>
      <button data-view="dashboard">Creator Dashboard</button>
      <button data-view="bookings">My Bookings</button>
    </nav>
    <div class="user-switch">
      <label for="userSelect">Acting as</label>
      <select id="userSelect"></select>
    </div>
  </header>

  <main>

    <!-- ============ MARKETPLACE ============ -->
    <section class="view active" id="view-marketplace">
      <h2 class="page-title">Marketplace</h2>
      <p class="page-sub">Discover young creators offering their skills.</p>

      <div class="filters">
        <input id="searchInput" type="text" placeholder="🔍 Search gigs by title or description…" />
        <select id="sortSelect">
          <option value="newest">Newest first</option>
          <option value="rate-asc">Price: Low → High</option>
          <option value="rate-desc">Price: High → Low</option>
        </select>
      </div>

      <div class="chips" id="categoryChips"></div>
      <div class="gig-grid" id="gigGrid"></div>
    </section>

    <!-- ============ POST A GIG ============ -->
    <section class="view" id="view-post">
      <h2 class="page-title">Post a Gig</h2>
      <p class="page-sub">List a service you offer. Clients will find and book you.</p>

      <div class="panel">
        <form class="form-grid" id="gigForm">
          <div>
            <label for="gTitle">Gig title</label>
            <input id="gTitle" type="text" placeholder="e.g. I will design a modern logo" required />
          </div>
          <div>
            <label for="gCategory">Category</label>
            <select id="gCategory" required></select>
          </div>
          <div>
            <label for="gRate">Rate (₹)</label>
            <input id="gRate" type="number" min="1" placeholder="1500" required />
          </div>
          <div>
            <label for="gDesc">Description</label>
            <textarea id="gDesc" placeholder="Describe what you'll deliver, your process, and turnaround time…" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: fit-content;">Publish Gig</button>
        </form>
      </div>
    </section>

    <!-- ============ CREATOR DASHBOARD ============ -->
    <section class="view" id="view-dashboard">
      <h2 class="page-title">Creator Dashboard</h2>
      <p class="page-sub">Your incoming booking requests.</p>

      <div class="stats" id="creatorStats"></div>
      <div class="booking-list" id="incomingBookings"></div>
    </section>

    <!-- ============ MY BOOKINGS ============ -->
    <section class="view" id="view-bookings">
      <h2 class="page-title">My Bookings</h2>
      <p class="page-sub">Track the status of the gigs you've requested.</p>
      <div class="booking-list" id="myBookings"></div>
    </section>

  </main>
</div>

<!-- ============ BOOKING MODAL ============ -->
<div class="modal-backdrop" id="bookingModal">
  <div class="modal">
    <h3 id="modalGigTitle">Book this gig</h3>
    <p class="sub" id="modalGigMeta"></p>
    <form class="form-grid" id="bookingForm">
      <input type="hidden" id="modalGigId" />
      <div>
        <label for="bName">Your name</label>
        <input id="bName" type="text" required />
      </div>
      <div>
        <label for="bMessage">Message to the creator</label>
        <textarea id="bMessage" placeholder="Briefly describe what you need…" required></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Send Booking Request</button>
        <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ CONFIRMATION MODAL ============ -->
<div class="modal-backdrop" id="confirmModal">
  <div class="modal" style="text-align:center;">
    <div style="font-size: 52px; margin-bottom: 10px;">✅</div>
    <h3>Booking Request Sent!</h3>
    <p class="sub" id="confirmText"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-primary" id="confirmViewBookings">View My Bookings</button>
      <button class="btn btn-ghost" id="confirmClose">Keep Browsing</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="check">✓</span><span id="toastText"></span></div>

<script>
/* =========================================================
   DATA LAYER  —  localStorage-backed store
   ========================================================= */
const DB_KEY = 'gigly_db_v1';

const CATEGORIES = ['Design','Development','Writing','Video','Music','Marketing'];

const SEED_USERS = [
  { id: 'u_aarav',  name: 'Aarav (creator)',  role: 'creator' },
  { id: 'u_priya',  name: 'Priya (client)',   role: 'client'  },
  { id: 'u_rohan',  name: 'Rohan (client)',   role: 'client'  },
  { id: 'u_neha',   name: 'Neha (creator)',   role: 'creator' },
];

const SEED_GIGS = [
  { id: 'g1', creatorId: 'u_aarav', title: 'I will design a modern minimalist logo', category: 'Design', rate: 1500, description: 'Clean, scalable logo with 2 revisions and all source files. Delivered in 3 days.', createdAt: Date.now() - 1000*60*60*2 },
  { id: 'g2', creatorId: 'u_neha',  title: 'I will build a responsive landing page',   category: 'Development', rate: 3500, description: 'Mobile-first landing page using HTML/CSS/JS. Includes contact form and animations.', createdAt: Date.now() - 1000*60*60*8 },
  { id: 'g3', creatorId: 'u_aarav', title: 'I will write SEO blog articles (1000 words)', category: 'Writing', rate: 800, description: 'Well-researched, plagiarism-free articles optimised for search engines.', createdAt: Date.now() - 1000*60*60*20 },
  { id: 'g4', creatorId: 'u_neha',  title: 'I will edit your YouTube video',            category: 'Video', rate: 2000, description: 'Cuts, transitions, colour grading, captions and background music.', createdAt: Date.now() - 1000*60*60*40 },
  { id: 'g5', creatorId: 'u_aarav', title: 'I will compose original background music',   category: 'Music', rate: 2500, description: 'Custom royalty-free track for your video, podcast or game.', createdAt: Date.now() - 1000*60*60*60 },
  { id: 'g6', creatorId: 'u_neha',  title: 'I will run your social media ads',           category: 'Marketing', rate: 4000, description: 'Full campaign setup on Instagram and Facebook with audience targeting.', createdAt: Date.now() - 1000*60*60*90 },
];

function loadDB() {
  const raw = localStorage.getItem(DB_KEY);
  if (raw) { try { return JSON.parse(raw); } catch(e){} }
  const fresh = { users: SEED_USERS, gigs: SEED_GIGS, bookings: [] };
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }

let DB = loadDB();
let CURRENT_USER_ID = DB.users.find(u => u.role === 'creator').id;

/* =========================================================
   HELPERS
   ========================================================= */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const userById = id => DB.users.find(u => u.id === id);
const gigById  = id => DB.gigs.find(g => g.id === id);
const fmtMoney = n => '₹' + Number(n).toLocaleString('en-IN');
const timeAgo = ts => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
};

function showToast(msg) {
  $('#toastText').textContent = msg;
  $('#toast').classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => $('#toast').classList.remove('show'), 2600);
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function go(view) {
  $$('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + view).classList.add('active');
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'marketplace') renderMarketplace();
  if (view === 'dashboard')   renderDashboard();
  if (view === 'bookings')    renderMyBookings();
  if (view === 'post')        renderPostForm();
}

$('#tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (btn) go(btn.dataset.view);
});

/* =========================================================
   USER SWITCHER
   ========================================================= */
function renderUserSelect() {
  const sel = $('#userSelect');
  sel.innerHTML = DB.users.map(u =>
    `<option value="${u.id}" ${u.id === CURRENT_USER_ID ? 'selected' : ''}>${u.name}</option>`
  ).join('');
}
$('#userSelect').addEventListener('change', e => {
  CURRENT_USER_ID = e.target.value;
  // re-render whatever is visible
  const active = $('.view.active').id.replace('view-', '');
  go(active);
});

/* =========================================================
   MARKETPLACE
   ========================================================= */
let state = { search: '', category: 'all', sort: 'newest' };

function renderCategoryChips() {
  const chips = ['all', ...CATEGORIES];
  $('#categoryChips').innerHTML = chips.map(c => {
    const label = c === 'all' ? 'All' : c;
    const active = state.category === c ? 'active' : '';
    return `<div class="chip ${active}" data-cat="${c}">${label}</div>`;
  }).join('');
  $$('#categoryChips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.category = chip.dataset.cat;
      renderMarketplace();
    });
  });
}

function getVisibleGigs() {
  let list = [...DB.gigs];

  if (state.category !== 'all') list = list.filter(g => g.category === state.category);

  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(g =>
    g.title.toLowerCase().includes(q) ||
    g.description.toLowerCase().includes(q) ||
    g.category.toLowerCase().includes(q)
  );

  // ---- DP3: Discovery / ranking ----
  if (state.sort === 'newest')     list.sort((a,b) => b.createdAt - a.createdAt);
  if (state.sort === 'rate-asc')   list.sort((a,b) => a.rate - b.rate);
  if (state.sort === 'rate-desc')  list.sort((a,b) => b.rate - a.rate);

  // small "rising creator" boost: creators with zero accepted bookings float up
  if (state.sort === 'newest') {
    list.sort((a,b) => {
      const aRising = isRisingCreator(a.creatorId) ? 1 : 0;
      const bRising = isRisingCreator(b.creatorId) ? 1 : 0;
      if (aRising !== bRising) return bRising - aRising;
      return 0;
    });
  }
  return list;
}

function isRisingCreator(creatorId) {
  const accepted = DB.bookings.filter(b => {
    const g = gigById(b.gigId);
    return g && g.creatorId === creatorId && b.status === 'accepted';
  }).length;
  return accepted === 0;
}

function renderMarketplace() {
  renderCategoryChips();
  const gigs = getVisibleGigs();
  const grid = $('#gigGrid');

  if (!gigs.length) {
    grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">
      <div class="big">🔍</div>
      <div>No gigs match your search.</div>
      <div style="font-size:13px;margin-top:6px;">Try a different keyword or category.</div>
    </div>`;
    return;
  }

  grid.innerHTML = gigs.map(g => {
    const creator = userById(g.creatorId);
    const rising = isRisingCreator(g.creatorId);
    return `
      <div class="gig-card">
        <span class="cat-badge">${g.category}</span>
        <h3>${escapeHtml(g.title)}</h3>
        <p class="desc">${escapeHtml(g.description)}</p>
        <div class="footer">
          <div>
            <div class="rate">${fmtMoney(g.rate)}</div>
            <div class="creator">by ${creator ? creator.name.split(' ')[0] : 'Unknown'} · ${timeAgo(g.createdAt)}</div>
          </div>
          <button class="btn btn-primary btn-sm" data-book="${g.id}">Book</button>
        </div>
        ${rising ? `<div style="position:absolute;top:14px;right:14px;font-size:11px;background:rgba(34,197,94,0.15);color:var(--green);padding:3px 9px;border-radius:999px;font-weight:600;">RISING</div>` : ''}
      </div>
    `;
  }).join('');

  grid.querySelectorAll('[data-book]').forEach(btn => {
    btn.addEventListener('click', () => openBookingModal(btn.dataset.book));
  });
}

$('#searchInput').addEventListener('input', e => { state.search = e.target.value; renderMarketplace(); });
$('#sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderMarketplace(); });

/* =========================================================
   POST A GIG
   ========================================================= */
function renderPostForm() {
  $('#gCategory').innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
}

$('#gigForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#gTitle').value.trim();
  const category = $('#gCategory').value;
  const rate = Number($('#gRate').value);
  const description = $('#gDesc').value.trim();

  if (!title || !category || !rate || !description) return;

  const gig = {
    id: uid('g'),
    creatorId: CURRENT_USER_ID,
    title, category, rate, description,
    createdAt: Date.now(),
  };
  DB.gigs.push(gig);
  saveDB();

  $('#gigForm').reset();
  showToast('Gig published!');
  state.sort = 'newest';
  go('marketplace');
});

/* =========================================================
   BOOKING
   ========================================================= */
function openBookingModal(gigId) {
  const g = gigById(gigId);
  if (!g) return;
  $('#modalGigId').value = gigId;
  $('#modalGigTitle').textContent = g.title;
  $('#modalGigMeta').textContent = `${g.category} · ${fmtMoney(g.rate)} · by ${userById(g.creatorId).name}`;

  const me = userById(CURRENT_USER_ID);
  $('#bName').value = me.role === 'client' ? me.name.replace(/\s*\(.*\)/, '') : '';
  $('#bookingModal').classList.add('open');
}

$('#modalCancel').addEventListener('click', () => $('#bookingModal').classList.remove('open'));

$('#bookingForm').addEventListener('submit', e => {
  e.preventDefault();
  const gigId = $('#modalGigId').value;
  const name = $('#bName').value.trim();
  const message = $('#bMessage').value.trim();
  if (!gigId || !name || !message) return;

  const booking = {
    id: uid('b'),
    gigId,
    clientId: CURRENT_USER_ID,
    clientName: name,
    message,
    status: 'pending',
    createdAt: Date.now(),
  };
  DB.bookings.push(booking);
  saveDB();

  $('#bookingModal').classList.remove('open');
  $('#bookingForm').reset();

  const g = gigById(gigId);
  const creator = userById(g.creatorId);
  $('#confirmText').textContent =
    `Your request for "${g.title}" was sent to ${creator.name}. You'll be notified when they respond.`;
  $('#confirmModal').classList.add('open');
});

$('#confirmClose').addEventListener('click', () => {
  $('#confirmModal').classList.remove('open');
  go('marketplace');
});
$('#confirmViewBookings').addEventListener('click', () => {
  $('#confirmModal').classList.remove('open');
  go('bookings');
});

/* =========================================================
   CREATOR DASHBOARD
   ========================================================= */
function renderDashboard() {
  const myGigs = DB.gigs.filter(g => g.creatorId === CURRENT_USER_ID);
  const myGigIds = myGigs.map(g => g.id);
  const incoming = DB.bookings.filter(b => myGigIds.includes(b.gigId))
                              .sort((a,b) => b.createdAt - a.createdAt);

  const pending  = incoming.filter(b => b.status === 'pending').length;
  const accepted = incoming.filter(b => b.status === 'accepted').length;
  const earned   = incoming.filter(b => b.status === 'accepted')
                           .reduce((sum, b) => sum + (gigById(b.gigId)?.rate || 0), 0);

  $('#creatorStats').innerHTML = `
    <div class="stat"><div class="num">${myGigs.length}</div><div class="lbl">Live gigs</div></div>
    <div class="stat"><div class="num">${pending}</div><div class="lbl">Pending requests</div></div>
    <div class="stat"><div class="num">${accepted}</div><div class="lbl">Accepted</div></div>
    <div class="stat"><div class="num">${fmtMoney(earned)}</div><div class="lbl">Total earned</div></div>
  `;

  const list = $('#incomingBookings');
  if (!incoming.length) {
    list.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <div>No booking requests yet.</div>
      <div style="font-size:13px;margin-top:6px;">Publish a gig so clients can find you.</div>
    </div>`;
    return;
  }

  list.innerHTML = incoming.map(b => {
    const g = gigById(b.gigId);
    const client = b.clientName || userById(b.clientId)?.name || 'Client';
    const showActions = b.status === 'pending';
    return `
      <div class="booking-card">
        <div class="info">
          <h4>${escapeHtml(g ? g.title : 'Deleted gig')}</h4>
          <div class="meta">👤 ${escapeHtml(client)} · ${timeAgo(b.createdAt)} · ${g ? fmtMoney(g.rate) : ''}</div>
          <div class="msg">"${escapeHtml(b.message)}"</div>
        </div>
        <div class="actions">
          <span class="status ${b.status}">${b.status}</span>
          ${showActions ? `
            <button class="btn btn-success btn-sm" data-accept="${b.id}">Accept</button>
            <button class="btn btn-danger btn-sm"  data-decline="${b.id}">Decline</button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-accept]').forEach(btn =>
    btn.addEventListener('click', () => handleAccept(btn.dataset.accept)));
  list.querySelectorAll('[data-decline]').forEach(btn =>
    btn.addEventListener('click', () => handleDecline(btn.dataset.decline)));
}

function handleAccept(bookingId) {
  const b = DB.bookings.find(x => x.id === bookingId);
  if (!b) return;
  b.status = 'accepted';
  b.decidedAt = Date.now();
  // DP2: auto-decline other pending bookings on the same gig
  DB.bookings.forEach(other => {
    if (other.id !== b.id && other.gigId === b.gigId && other.status === 'pending') {
      other.status = 'declined';
      other.reason = 'Gig was filled by another booking.';
      other.decidedAt = Date.now();
    }
  });
  saveDB();
  showToast('Booking accepted.');
  renderDashboard();
}

function handleDecline(bookingId) {
  const b = DB.bookings.find(x => x.id === bookingId);
  if (!b) return;
  b.status = 'declined';
  b.decidedAt = Date.now();
  saveDB();
  showToast('Booking declined.');
  renderDashboard();
}

/* =========================================================
   MY BOOKINGS (client)
   ========================================================= */
function renderMyBookings() {
  const mine = DB.bookings.filter(b => b.clientId === CURRENT_USER_ID)
                          .sort((a,b) => b.createdAt - a.createdAt);
  const list = $('#myBookings');

  if (!mine.length) {
    list.innerHTML = `<div class="empty">
      <div class="big">🎫</div>
      <div>You haven't booked anything yet.</div>
      <div style="font-size:13px;margin-top:6px;">Head to the marketplace to find a creator.</div>
    </div>`;
    return;
  }

  list.innerHTML = mine.map(b => {
    const g = gigById(b.gigId);
    const creator = g ? userById(g.creatorId) : null;

    // ---- DP1: what a client sees after decline ----
    let extra = '';
    if (b.status === 'declined') {
      extra = `
        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" data-similar="${g ? g.category : ''}">Find similar gigs</button>
        </div>
        ${b.reason ? `<div class="msg" style="margin-top:8px;">Reason: ${escapeHtml(b.reason)}</div>` : ''}
      `;
    }

    return `
      <div class="booking-card">
        <div class="info">
          <h4>${escapeHtml(g ? g.title : 'Deleted gig')}</h4>
          <div class="meta">
            ${creator ? 'by ' + escapeHtml(creator.name.split(' ')[0]) : ''}
            · ${g ? fmtMoney(g.rate) : ''} · requested ${timeAgo(b.createdAt)}
          </div>
          <div class="msg">"${escapeHtml(b.message)}"</div>
          ${extra}
        </div>
        <div class="actions">
          <span class="status ${b.status}">${b.status}</span>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-similar]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.category = btn.dataset.similar || 'all';
      state.search = '';
      $('#searchInput').value = '';
      go('marketplace');
    });
  });
}

/* =========================================================
   UTIL
   ========================================================= */
function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

/* =========================================================
   BOOT
   ========================================================= */
renderUserSelect();
renderPostForm();
renderMarketplace();
</script>
</body>
</html>
